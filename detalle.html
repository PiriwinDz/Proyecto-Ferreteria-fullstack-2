<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Ferretería Los Maestros</title>
</head>
<body>

    <h1>Detalle del Producto</h1>

    <div>
        <img id="imagen" width="250" alt="Imagen del producto"><br>
        <h2 id="nombre"></h2>
        <p><strong>Código:</strong> <span id="codigo"></span></p>
        <p><strong>Categoría:</strong> <span id="categoria"></span></p>
        <p><strong>Marca:</strong> <span id="marca"></span></p>
        <p><strong>Formato:</strong> <span id="unidad"></span></p>
        <p><strong>Precio:</strong> $<span id="precio"></span></p>
        <p><strong>Stock disponible:</strong> <span id="stock"></span> unidades</p>
        <p><strong>Descripción:</strong> <span id="descripcion"></span></p>
    </div>

    <br>
    <a href="catalogo.html">⬅️ Volver al Catálogo</a>

    <!-- Conectar JavaScript de detalle -->
    <script src="js/detalle.js"></script>
</body>
</html>
