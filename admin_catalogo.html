<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración de Catálogo - Los Maestros</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">


  <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning fs-4" href="pagina_principal.html">Los Maestros</a>
      <span class="badge bg-danger ms-2">Modo Administrador</span>

      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="pagina_principal.html" class="btn btn-outline-light btn-sm">Ver Tienda</a>
        <button class="btn btn-danger btn-sm" id="btnCerrarSesion">Cerrar sesión</button>
      </div>
    </div>
  </nav>


  <main class="container my-5 flex-grow-1">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
      <div>
        <h2 class="fw-bold mb-0">Gestión de Productos</h2>
        <p class="text-muted mb-0">Modifica precios, descripciones, o agrega y elimina productos.</p>
      </div>
      <button class="btn btn-success d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalAgregar">
        <i class="bi bi-plus-circle"></i> Agregar Producto
      </button>
    </div>

  
    <div class="row g-4" id="listaProductos"></div>
  </main>

  
  <div class="modal fade" id="modalAgregar" tabindex="-1" aria-labelledby="modalAgregarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold" id="modalAgregarLabel">Nuevo Producto</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formNuevoProducto">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Nombre</label>
              <input type="text" class="form-control" id="nuevoNombre" placeholder="Ej: Taladro Percutor" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Precio ($ CLP)</label>
              <input type="number" class="form-control" id="nuevoPrecio" placeholder="Ej: 45000" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control" id="nuevaDesc" rows="3" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">URL Imagen (opcional)</label>
              <input type="text" class="form-control" id="nuevaImagen" placeholder="Imagenes/Productos/ejemplo.png">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success fw-bold">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-warning">
          <h5 class="modal-title fw-bold" id="modalEditarLabel">Editar Producto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="formActualizarProducto">
          <div class="modal-body">
            <input type="hidden" id="editId">
            <div class="mb-3">
              <label class="form-label fw-semibold text-muted">Producto</label>
              <input type="text" class="form-control bg-light" id="editNombre" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Precio ($ CLP)</label>
              <input type="number" class="form-control" id="editPrecio" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Descripción</label>
              <textarea class="form-control" id="editDesc" rows="3" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-warning fw-bold">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


  <script src="js/admin-productos.js"></script>
</body>
</html>
</body>
</html>    
    </body>
</html>
